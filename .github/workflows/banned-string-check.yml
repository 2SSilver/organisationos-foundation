name: banned-string-check (reusable)

on:
  workflow_call:
    inputs:
      foundation-repo:
        type: string
        required: true
        description: 'Foundation repo in owner/name format'
      foundation-ref:
        type: string
        default: main
        description: 'Foundation ref to checkout for banned-patterns.yml'

jobs:
  banned:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Foundation repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.foundation-repo }}
          ref: ${{ inputs.foundation-ref }}
          path: _foundation
      - name: Install ripgrep + yq
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Scan changed files for banned patterns
        run: |
          set -e
          patterns_file="_foundation/standards/banned-patterns.yml"
          if [ ! -f "$patterns_file" ]; then
            echo "::error::banned-patterns.yml not found in Foundation checkout. Verify inputs.foundation-repo."
            exit 1
          fi
          scan_script="_foundation/.github/scripts/banned-scan.sh"
          if [ ! -f "$scan_script" ]; then
            echo "::error::banned-scan.sh not found in the Foundation checkout at ref '${{ inputs.foundation-ref }}'."
            echo "::error::This workflow version requires it. Point inputs.foundation-ref at a Foundation commit that includes .github/scripts/banned-scan.sh (main does)."
            exit 1
          fi
          changed=$(git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD")
          if [ -z "$changed" ]; then exit 0; fi
          # Build the scan list here; the scan itself lives in one script both
          # enforcement points call, so the gate and the hook cannot drift apart.
          scan=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            case "$f" in _foundation/*) continue ;; esac
            case "$f" in standards/banned-patterns.yml) continue ;; esac
            # The scan's own fixtures must contain the patterns to test against.
            case "$f" in .github/scripts/banned-scan.test.sh) continue ;; esac
            scan+=("$f")
          done <<< "$changed"
          [ ${#scan[@]} -gt 0 ] || exit 0
          fail=0
          if ! bash _foundation/.github/scripts/banned-scan.sh "$patterns_file" "${scan[@]}"; then
            fail=1
          fi
          if [ $fail -ne 0 ]; then
            echo ""
            echo "If a banned string has already reached origin, treat the secret as compromised and rotate."
            echo "If you are unsure whether content is safe to commit, ask the Admin — do not force-push."
          fi
          exit $fail
