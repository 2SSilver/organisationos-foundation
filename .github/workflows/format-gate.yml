name: format-gate

on:
  workflow_call:
    inputs:
      foundation-repo:
        type: string
        required: false
        default: ''
        description: 'Foundation repo in owner/name format. Empty means <this repo owner>/organisationos-foundation.'
      foundation-ref:
        type: string
        required: false
        default: main
        description: 'Foundation ref to checkout for FORMATS.md and format-scan.sh'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SSOT check — allowed_extensions must match FORMATS.md (MR-18a)
        # FORMATS.md's "In Git — whitelist" table is canonical. This step fails
        # the gate on divergence rather than generating allowed_extensions from
        # FORMATS.md at runtime, so the core logic below stays hand-readable and
        # its failure output stays a plain, static string.
        run: |
          set -e
          allowed_extensions="md txt csv tsv json jsonc yaml yml toml html svg png pdf excalidraw drawio"
          formats_extensions=$(sed -n '/## In Git — whitelist/,/Per-PR aggregate cap/p' FORMATS.md \
            | grep -oE '`\.[a-zA-Z]+`' | tr -d '`.' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          normalized_allowed=$(echo "$allowed_extensions" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          if [ "$formats_extensions" != "$normalized_allowed" ]; then
            echo "::error file=FORMATS.md::format-gate.yml's allowed_extensions ('$normalized_allowed') has drifted from FORMATS.md's whitelist ('$formats_extensions'). Update this workflow's allowed_extensions to match FORMATS.md (or vice versa if FORMATS.md is the one that changed), then re-run."
            exit 1
          fi
      - name: Checkout Foundation (MR-18b + the shared format scan)
        # Leadership and Domain each carry a mirror of Foundation's FORMATS.md
        # (a one-line mirror note + the identical body), and neither carries
        # format-scan.sh. One full checkout serves both the SSOT diff below and
        # the scan step. This is a no-op in Foundation's own repo, which has
        # both on disk already.
        if: ${{ !endsWith(github.repository, 'organisationos-foundation') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.foundation-repo != '' && inputs.foundation-repo || format('{0}/organisationos-foundation', github.repository_owner) }}
          ref: ${{ inputs.foundation-ref }}
          path: _foundation
      - name: SSOT check — FORMATS.md byte-identical to canonical (MR-18b)
        # Kept as a diff check rather than replacing the mirrors with a
        # two-line `@`-import stub, because FORMATS.md is read standalone by
        # humans and by this same gate in each repo — a stub would break that.
        if: ${{ !endsWith(github.repository, 'organisationos-foundation') }}
        run: |
          set -e
          # Compare bodies only: this repo's FORMATS.md carries a mirror-note
          # header (lines 1-2) that Foundation's canonical copy does not.
          if ! diff -q <(tail -n +3 FORMATS.md) _foundation/FORMATS.md > /dev/null; then
            echo "::error file=FORMATS.md::this repo's FORMATS.md whitelist has diverged from Foundation's canonical copy. Sync it to match, or open a Foundation PR first if the canonical whitelist needs to change."
            diff <(tail -n +3 FORMATS.md) _foundation/FORMATS.md || true
            exit 1
          fi
      - name: Verify changed files against FORMATS.md whitelist
        run: |
          set -e
          allowed_extensions="md txt csv tsv json jsonc yaml yml toml html svg png pdf excalidraw drawio"
          scan_script="_foundation/.github/scripts/format-scan.sh"
          if [ ! -f "$scan_script" ]; then scan_script=".github/scripts/format-scan.sh"; fi
          if [ ! -f "$scan_script" ]; then
            echo "::error::format-scan.sh not found in the Foundation checkout at ref '${{ inputs.foundation-ref }}', nor in this repo."
            echo "::error::This workflow version requires it. Point inputs.foundation-ref at a Foundation commit that includes .github/scripts/format-scan.sh (main does)."
            exit 1
          fi
          changed=$(git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD")
          if [ -z "$changed" ]; then exit 0; fi
          # shellcheck disable=SC2086
          bash "$scan_script" "$allowed_extensions" $changed
