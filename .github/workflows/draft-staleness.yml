name: draft-staleness

on:
  schedule:
    # Runs weekly on Monday at 09:00 UTC; the monthly DRI issue (1st of month) reads its output.
    #
    # Foundation has no `_drafts/` of its own, so this run always reports clean —
    # and Leadership's identical cron was removed for exactly that reason. It is
    # kept HERE deliberately: Actions is enabled only in Foundation, so this is
    # the one place the detector executes at all. It is the live smoke test that
    # this workflow still runs green after the git-history rewrite, which matters
    # precisely because the detector it replaced could never fire anywhere. The
    # callers in Domain set their own schedule; this trigger does not affect them.
    - cron: '0 9 * * 1'
  workflow_dispatch:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find drafts older than 14 days
        id: scan
        run: |
          set -e
          # actions/checkout writes every file fresh, so filesystem mtime is
          # always ~0 seconds old — `find -mtime +14` can never match, in any
          # repo, on any run. Age comes from git history instead: the last
          # commit that touched each file under a `_drafts/` folder, compared
          # against a 14-day cutoff. This needs fetch-depth: 0 above — a
          # shallow clone's `git log` for a given path is unreliable (the
          # commit that last touched it may sit outside the shallow window).
          cutoff=$(date -u -d '14 days ago' +%s)
          stale=""
          files=$(find . -path '*/_drafts/*' -type f -not -name '.gitkeep')
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            last_commit=$(git log -1 --format=%ct -- "$f" || true)
            if [ -z "$last_commit" ]; then
              # No commit touched this path (e.g. untracked/new-this-run) —
              # nothing to compare against; treat as not-yet-stale rather
              # than silently skip-and-report-clean.
              continue
            fi
            if [ "$last_commit" -lt "$cutoff" ]; then
              stale="${stale}${f}"$'\n'
            fi
          done <<< "$files"
          stale=$(printf '%s\n' "$stale" | sed '/^$/d')
          if [ -z "$stale" ]; then
            echo "result=clean" >> $GITHUB_OUTPUT
            echo "No stale drafts."
            exit 0
          fi
          echo "result=stale" >> $GITHUB_OUTPUT
          echo "Stale drafts (>14 days since last commit):"
          echo "$stale"
          {
            echo 'list<<EOF'
            echo "$stale"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - name: Post staleness report as an issue
        if: steps.scan.outputs.result == 'stale'
        uses: actions/github-script@v7
        with:
          script: |
            const list = `${{ steps.scan.outputs.list }}`;
            const body = [
              '# Stale drafts report',
              '',
              `Drafts in \`_drafts/\` folders older than 14 days. Each draft has three end-states: **merged**, **retired** (moved to \`_archive/\`), or **extended** (Domain Lead approves another 14 days).`,
              '',
              '## Drafts',
              '```',
              list,
              '```',
              '',
              'Admin: include these in the next monthly DRI close-out and decide per draft.'
            ].join('\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Draft staleness — ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['drift', 'harness']
            });
