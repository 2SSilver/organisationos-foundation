name: claude-md-length

on:
  workflow_call:

jobs:
  length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no CLAUDE.md exceeds 300 lines
        run: |
          set -e
          fail=0
          for f in $(find . -name CLAUDE.md -not -path '*/node_modules/*' -not -path '*/_archive/*'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 300 ]; then
              echo "::error file=$f::CLAUDE.md is $lines lines (cap: 300). Multi-step procedures move into skills or scoped rule files, not the main CLAUDE.md."
              fail=1
            fi
          done
          exit $fail
