name: self-ci

# Foundation's self-caller (MR-04 fix). Every workflow Foundation ships is a
# `workflow_call` reusable with no caller of its own — without this file, Foundation
# PRs run zero CI even though Domain and Leadership run the full suite against
# Foundation's reusables. This is the delivery mechanism for the reusable-workflow
# pattern's promise that "Foundation's own workflows run directly against Foundation PRs."
#
# Foundation calls its own reusables by LOCAL path (`./.github/workflows/<name>.yml`),
# not the cross-repo pinned-tag form (`@v1`) Domain/Leadership callers use —
# the reusable lives in this same repo, so there is no cross-repo version to pin.
#
# Included — every reusable below exposes only `workflow_call` (no schedule/dispatch
# trigger of its own), so nothing else runs it against a Foundation PR:
#   - back-flow-rules  — Pattern A only; internally guarded by the `back-flow` label
#     check, so it is a no-op on every other PR. Foundation's own CLAUDE.md names
#     "back-flow review" as one of its two confidentiality-enforcement layers, so this
#     needs to run here too, not just in Domain.
#
# Excluded — promotion-lint is NOT included here even though it otherwise fits the
# "exposes only workflow_call" inclusion rule: it checks `domain-*/adrs/` for
# cross-domain ADRs needing promotion, and Foundation has no `domain-*/adrs/` tree.
# Wiring it in would only add a permanent, always-green no-op check.
#
# Excluded — these already run on their own schedule/workflow_dispatch trigger, so
# adding them here would just duplicate that trigger on every PR:
#   - draft-staleness.yml (weekly schedule)
#   - propagation-sla.yml (weekly schedule)
#   - monthly-dri.yml (workflow_dispatch here; the cron lives in Leadership's caller)
#
# Task 4 adds integrity jobs directly in this file (not as standalone reusable workflow
# files): banned-patterns-validate, codeowners-lint, checklist-complete, agent-mirror-sync.
# These four are Foundation-only checks (no Domain/Leadership caller ever needs to invoke
# them), so there is no reason to pay the `workflow_call` reusable-file overhead — they are
# added as jobs here, consistent with self-ci.yml already being the place Foundation-only
# integrity logic lives. (Domain's glossary-consistency.yml, added in the same task, is a
# separate case — it is Domain-only and follows the Category B two-checkout caller shape
# instead; see that file's header comment.)

on:
  pull_request:
    # `labeled`/`unlabeled` are included for the `back-flow-rules` job, whose
    # label remains its signal by design: back-flow is a provenance claim, not
    # something derivable from which files changed. A PR that gains the
    # `back-flow` label after opening must re-trigger this workflow, or the
    # 500-line cap and the 24-hour cool-off never apply to it.
    #
    # `checklist-complete` no longer needs these: it is path-driven since AR-09
    # and carries no label condition at all. The types stay for back-flow.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  banned-string:
    uses: ./.github/workflows/banned-string-check.yml
    with:
      # Foundation IS the Foundation repo, so it resolves its own name rather
      # than carrying the <adopter-org> placeholder that Domain and Leadership
      # callers use. With the placeholder this job tried to clone a repository
      # that cannot exist and failed with git exit 128.
      foundation-repo: ${{ github.repository }}
      # Check the PR's own copy of banned-patterns.yml, not main — see Step 3's
      # exemption in banned-string-check.yml for the companion fix (Fs2-8).
      foundation-ref: ${{ github.sha }}
  markdown-lint:
    # Job-scoped write: this job's reusable posts a PR comment on failure via
    # github-script. Without it the comment step dies with "Resource not
    # accessible by integration" and fails the job even when the check itself
    # behaved correctly. Scoped here, not at workflow level, so the other jobs
    # stay on the repo's read-only default.
    permissions:
      pull-requests: write
      contents: read
    uses: ./.github/workflows/markdown-lint.yml
  format-gate:
    uses: ./.github/workflows/format-gate.yml
  structure-check:
    uses: ./.github/workflows/structure-check.yml
  stale-path-check:
    uses: ./.github/workflows/stale-path-check.yml
  pr-preview:
    # Job-scoped, not workflow-scoped: a caller must be able to grant whatever
    # its callee requests, and pr-preview posts a PR comment. Keeping the grant
    # on this one job leaves every other job in this file on the repo's
    # read-only default. A workflow-level block would hand write access to all
    # twelve.
    permissions:
      pull-requests: write
      contents: read
    uses: ./.github/workflows/pr-preview.yml
  claude-md-length:
    uses: ./.github/workflows/claude-md-length.yml
  link-check:
    # Job-scoped write: this job's reusable posts a PR comment on failure via
    # github-script. Without it the comment step dies with "Resource not
    # accessible by integration" and fails the job even when the check itself
    # behaved correctly. Scoped here, not at workflow level, so the other jobs
    # stay on the repo's read-only default.
    permissions:
      pull-requests: write
      contents: read
    uses: ./.github/workflows/link-check.yml
  back-flow-rules:
    # Job-scoped write: this job's reusable posts a PR comment on failure via
    # github-script. Without it the comment step dies with "Resource not
    # accessible by integration" and fails the job even when the check itself
    # behaved correctly. Scoped here, not at workflow level, so the other jobs
    # stay on the repo's read-only default.
    permissions:
      pull-requests: write
      contents: read
    uses: ./.github/workflows/back-flow-rules.yml

  # --- Task 4 integrity jobs (below) ---

  banned-patterns-validate:
    # MR-08: a malformed standards/banned-patterns.yml would silently break the regex loop in
    # every Domain/Leadership banned-string-check caller and in the pre-commit hook. Runs on
    # every Foundation PR but only does work when banned-patterns.yml itself changed: parses
    # the YAML, compiles every regex-flagged pattern, and flags duplicate patterns.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip unless banned-patterns.yml changed
        id: changed
        run: |
          set -e
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -qx 'standards/banned-patterns.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install yq
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Validate banned-patterns.yml
        if: steps.changed.outputs.run == 'true'
        run: |
          set -e
          file="standards/banned-patterns.yml"
          fail=0
          # yq -e fails non-zero on malformed YAML or a non-sequence top level — this is the
          # "fail the PR on a malformed list" gate.
          if ! yq -e 'tag == "!!seq"' "$file" > /dev/null; then
            echo "::error file=$file::Does not parse as a YAML sequence."
            exit 1
          fi
          # Duplicate patterns.
          dupes=$(yq '.[] | .pattern' "$file" | grep -v '^null$' | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "::error file=$file::Duplicate pattern(s) found:"
            echo "$dupes"
            fail=1
          fi
          # Every pattern must compile as a regex. The scan matches each one with
          # `rg`, which applies regex semantics unconditionally, so a pattern that
          # does not compile is a broken entry regardless of how it is declared.
          regex_patterns=$(yq '.[] | select(has("pattern")) | .pattern' "$file" || true)
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if ! python3 -c "import re, sys; re.compile(sys.argv[1])" "$p" 2>/tmp/regex-err; then
              echo "::error file=$file::Pattern '$p' is flagged 'regex' but does not compile: $(cat /tmp/regex-err)"
              fail=1
            fi
          done <<< "$regex_patterns"
          exit $fail

  banned-scan-tests:
    # The banned-string scan is a confidentiality control, so its own logic is
    # tested rather than assumed. Runs the fixture suite in
    # .github/scripts/banned-scan.test.sh on every Foundation PR: a violating
    # input must fail and a clean one must pass, for plain, multi-word, regex and
    # !context-near entries alike.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep + yq
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run banned-scan tests
        run: bash .github/scripts/banned-scan.test.sh

  codeowners-lint:
    # MR-06: branch protection (docs/setup-org.md → Step 7) only matters if CODEOWNERS actually names >=1 owner
    # for every substrate path it is meant to gate. This catches the case where protection is
    # correctly configured but CODEOWNERS itself has a gap. The '*' default fallback does not
    # count as a dedicated owner for these paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every substrate path has a dedicated owner
        run: |
          set -e
          python3 <<'PY'
          import sys

          # Substrate paths from the three-repo model (docs/concepts.md) and the
          # branch-protection tier table (docs/setup-org.md → Step 7). Update this
          # list if Foundation's top-level substrate structure changes.
          SUBSTRATE_PATHS = [
              "standards", "standards/templates", "interfaces", "cross-domain-decisions",
              "architectural-decisions", "nfrs", "references", "glossary.md",
              ".github/workflows", ".github/hooks", ".github/agents",
              ".github/ISSUE_TEMPLATE", ".claude", "CLAUDE.md", "AGENTS.md",
              "FORMATS.md", ".mcp.json",
          ]

          rules = []
          with open(".github/CODEOWNERS") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  path = parts[0].strip("/")
                  handles = parts[1:]
                  rules.append((path, len(handles) > 0))

          def has_dedicated_owner(target):
              for path, owned in rules:
                  if path == "*" or not owned:
                      continue
                  if path == target or target.startswith(path + "/") or path.startswith(target + "/"):
                      return True
              return False

          fail = False
          for target in SUBSTRATE_PATHS:
              if not has_dedicated_owner(target):
                  print(f"::error file=.github/CODEOWNERS::Substrate path '{target}' has no dedicated CODEOWNERS entry with >=1 owner.")
                  fail = True

          sys.exit(1 if fail else 0)
          PY

  checklist-complete:
    # MR-06: produces the checklist-completeness check the PR templates promise.
    # Cross-domain/substrate artefacts (CDRs, interfaces, NFRs, architectural decisions) all
    # live in Foundation, so this is the one place the check needs to run.
    # All four of those categories must appear in the substrate regex below — omitting one
    # is a silent false pass, not a smaller check.
    #
    # Asked twice: should `standards/` and `glossary.md` be added to this regex too? No —
    # and this is why, so it stops being re-asked. The four paths in the regex
    # (cross-domain-decisions, interfaces, architectural-decisions, nfrs) are exactly the
    # four `.github/CODEOWNERS` entries carrying the six-owner superset: Admin + Leader +
    # all four Domain Leads. `standards/` and `glossary.md` are CODEOWNERS two-owner entries
    # (Admin + Leader only, no Domain Lead). The Approval checklist this job verifies asks
    # "did each affected Domain Lead approve" — unanswerable for a change no Domain Lead is
    # ever asked to review, so widening the regex would make CI demand a checklist item
    # CODEOWNERS never requires anyone to satisfy.
    # Known residual (unchanged by this comment, left as-is): `standards/` and `glossary.md`
    # get CODEOWNERS' two-owner review (Admin + Leader) and no checklist verification at
    # all — there is no CI check that a `standards/` or `glossary.md` PR's approvals are
    # real, the way this job verifies the four six-owner paths. Accepted gap, not fixed here.
    # AR-09: NO job-level `if:`. GitHub counts a skipped required check as
    # passing, so a label-gated job silently reported green on every
    # unlabelled cross-domain PR. Applicability is now computed from the
    # changed files inside the job, so the check always runs and always
    # reports. Labels are triage only and no longer gate anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether this PR is cross-domain
        id: scope
        run: |
          set -e
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          printf 'changed files:\n%s\n' "$files"
          cross=no
          # Substrate artefacts that are cross-domain by definition.
          if printf '%s\n' "$files" | grep -qE '^(cross-domain-decisions|interfaces|architectural-decisions|nfrs)/'; then
            cross=yes
          fi
          # Or a diff spanning two or more domain folders.
          domains=$(printf '%s\n' "$files" | grep -oE '^domain-[0-9]+/' | sort -u | wc -l | tr -d ' ')
          if [ "$domains" -ge 2 ]; then cross=yes; fi
          echo "cross_domain=$cross" >> "$GITHUB_OUTPUT"
          echo "cross_domain=$cross (domain folders touched: $domains)"
      - name: Verify the PR-template Approval checklist is complete
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CROSS_DOMAIN: ${{ steps.scope.outputs.cross_domain }}
        run: |
          set -e
          if [ "$CROSS_DOMAIN" != "yes" ]; then
            echo "Not a cross-domain PR — Approval checklist not required. Check passes."
            exit 0
          fi
          section=$(printf '%s\n' "$PR_BODY" | awk '/^## Approval checklist/{flag=1; next} /^## /{flag=0} flag')
          if [ -z "$section" ]; then
            echo "::error::This PR changes cross-domain substrate but its body has no '## Approval checklist' section. Use the PR template."
            exit 1
          fi
          unchecked=$(printf '%s\n' "$section" | grep -c '^- \[ \]' || true)
          if [ "$unchecked" -gt 0 ]; then
            echo "::error::This PR changes cross-domain substrate but the Approval checklist has $unchecked unticked box(es):"
            printf '%s\n' "$section" | grep '^- \[ \]'
            echo "Tick a box only once the named reviewer has actually approved — do not merge on an incomplete checklist."
            exit 1
          fi
          exit 0

  agent-mirror-sync:
    # MR-12: .github/agents/ is the Copilot-CLI-native location; .claude/agents/ is
    # a thin mirror Claude Code reads (see .claude/agents/README.md). The two must
    # stay identical or the vendor surfaces silently drift apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff .claude/agents against .github/agents
        run: |
          set -e
          # .claude/agents/README.md documents the mirror itself and has no .github/agents
          # counterpart by design — excluded, it is not one of the four mirrored agents.
          diff -rq --exclude=README.md .claude/agents .github/agents
