name: back-flow-rules

# Pattern A only — enforces the back-flow operational defences from v3.1 §8:
# the 500-line cap and 24-hour cool-off apply to every PR labelled
# `back-flow`, human- or agent-initiated alike.
#
# Agent-initiated back-flow ban (v3.1 §8, unchanged by v3.2). The ban is a
# session-mount-state condition, not an authorship-within-session claim: a
# commit made while --add-dir included a non-harness path fails CI. Caught by
# a session-id field in the PR template plus a hook that tags commits made
# under that condition (§8) — not by anything in this workflow. TODO: no such
# hook ships in these templates yet. Until it does, the agent-initiated ban
# is enforced by the session-id field plus reviewer judgement during the
# two-reviewer back-flow review (§8), not by an automated CI check here.
#
# v3.2 §8/§16 carve-out: a human-initiated, `back-flow`-labelled PR carrying
# only the Markdown source of a client-facing deliverable is permitted
# through the same two gates below. This workflow does not add a separate
# format check for the carve-out — a blanket Markdown-only check would also
# apply to every other `back-flow` PR, and v3.1 §8 already anticipates a
# back-flow PR carrying non-Markdown formats FORMATS.md permits (e.g. a PDF
# anonymised report). The source-only expectation for the carve-out is
# confirmed by the two reviewers during back-flow review, not by CI.
# Applies to PRs labelled `back-flow`.
#
# `knowledge-paths` input: the path tripwire's folder list, configurable for
# two reasons. (1) Spec §8 says the back-flow ritual does not apply to
# Pattern B adopters (harness-as-primary-workspace) — Pattern B has an exit
# from every other Pattern A mechanism but had none from this tripwire, since
# the folder list was hardcoded. Passing an empty string here gives Pattern B
# that exit: the tripwire goes inert (the label check itself, the 500-line
# cap and the 24h cool-off are unaffected — they still apply to anything a
# reviewer labels `back-flow` by hand). (2) No `methods/` or `prompts/`
# directory is pre-created — `domain-1/` ships `_archive _drafts adrs
# CLAUDE.md glossary.md README.md references.md` — and adopters following
# spec §7's three named patterns name their own folders (`topic-x/`;
# `strategy/`+`roadmap/`; `engineering/`+`analysis/`), which this list never
# matched. The names themselves are canonical, not accidental: Domain's
# README documents `domain-N/methods/` and `.github/CODEOWNERS` routes both
# folders, so the default stays as it is — a Pattern A adopter overrides it
# rather than the default being wrong.
# Default is the original `methods|prompts` value, so a caller that passes
# nothing keeps today's behaviour unchanged. Two disabling forms are accepted:
# the literal `none`, and an empty string. `none` is the documented one,
# because it does not depend on whether GitHub applies an input's default when
# an explicitly-passed value is empty — a semantic this harness should not bet
# a governance exit on. A non-empty value that is neither `none` nor a
# pipe-separated list of folder names FAILS the step rather than silently
# matching nothing: a typo that quietly disables a gate is the exact failure
# class this workflow exists to prevent.

on:
  workflow_call:
    inputs:
      knowledge-paths:
        description: >-
          Pipe-separated folder names under domain-N/ that trip the back-flow
          path tripwire (e.g. "methods|prompts" or "engineering|analysis").
          Pass "none" to disable the tripwire entirely (Pattern B); an empty
          string does the same. Any other unparseable value fails the check.
        required: false
        type: string
        default: 'methods|prompts'

jobs:
  back-flow:
    # AR-09: no job-level `if:`. A skipped required check reports as passing,
    # so label-gating meant an unlabelled back-flow PR silently cleared the
    # gate. The job now always runs and decides inside.
    #
    # The label stays the SIGNAL here, unlike checklist-complete. Back-flow is
    # a provenance claim — content that came from external client work and has
    # been anonymised — which is not derivable from where the files sit. Paths
    # are used as a TRIPWIRE instead: a diff in back-flow-shaped folders with
    # no `back-flow` label fails and asks for the label. Paths demand the
    # label; they do not replace it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide applicability (label is the signal, paths are a tripwire)
        id: scope
        run: |
          set -e
          labelled=${{ contains(github.event.pull_request.labels.*.name, 'back-flow') }}
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          knowledge_paths="${{ inputs.knowledge-paths }}"
          # `none` and empty both disable. Anything else must be a pipe-separated
          # list of plain folder names — validated, not trusted, so a typo cannot
          # silently turn the tripwire off while the check reports green.
          if [ "$knowledge_paths" = "none" ]; then knowledge_paths=""; fi
          if [ -n "$knowledge_paths" ] && ! printf '%s' "$knowledge_paths" | grep -qE '^[A-Za-z0-9_.-]+(\|[A-Za-z0-9_.-]+)*$'; then
            echo "::error::knowledge-paths is not a pipe-separated list of folder names: '$knowledge_paths'. Use e.g. 'methods|prompts', or 'none' to disable the tripwire. Refusing to run with a value that would match nothing and silently disable this gate."
            exit 1
          fi
          shaped=no
          if [ -n "$knowledge_paths" ] && printf '%s\n' "$files" | grep -qE "^domain-[0-9]+/($knowledge_paths)/"; then
            shaped=yes
          fi
          echo "knowledge-paths input: '$knowledge_paths' (tripwire $([ -n "$knowledge_paths" ] && echo active || echo inert))"
          echo "labelled=$labelled shaped=$shaped"
          if [ "$labelled" != "true" ] && [ "$shaped" = "yes" ]; then
            echo "::error::This PR changes domain-N/($knowledge_paths)/ — the folders back-flow content lands in — but carries no 'back-flow' label. Either label it so the 500-line cap and 24h cool-off apply, or move the change out of those folders. Do not merge an unlabelled back-flow PR."
            exit 1
          fi
          if [ "$labelled" != "true" ]; then
            echo "Not a back-flow PR — cap and cool-off not applicable. Check passes."
            echo "applies=no" >> "$GITHUB_OUTPUT"
          else
            echo "applies=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce 500-line cap on back-flow PRs
        if: steps.scope.outputs.applies == 'yes'
        run: |
          set -e
          added=$(git diff --shortstat "origin/${{ github.base_ref }}...HEAD" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          if [ "$added" -gt 500 ]; then
            echo "::error::Back-flow PR adds $added lines (cap: 500). Split into multiple PRs, each reviewed independently. See v3.1 §8."
            exit 1
          fi
      - name: Enforce 24-hour cool-off
        if: steps.scope.outputs.applies == 'yes'
        run: |
          set -e
          created="${{ github.event.pull_request.created_at }}"
          created_ts=$(date -d "$created" +%s)
          now_ts=$(date +%s)
          age=$((now_ts - created_ts))
          if [ "$age" -lt 86400 ]; then
            echo "::error::Back-flow PR cannot be merged within 24 hours of opening. Wait until $(date -d "@$((created_ts + 86400))"). See v3.1 §8."
            # Note: this prevents merge by failing required check; reviewers can still review during cool-off.
            exit 1
          fi
      - name: Plain-English comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'This `back-flow` PR was blocked by one of the operational defences (v3.1 §8):',
              '- Back-flow PRs add ≤500 net new lines.',
              '- Back-flow PRs cannot be merged within 24h of opening (Domain Lead reading time).',
              '',
              'The agent-initiated back-flow ban (§8) and the v3.2 human-initiated, source-only carve-out are not checked by this workflow — they rely on the session-id PR-template field and the two-reviewer back-flow review.',
              '',
              'If the change is genuinely large, split it. If it is genuinely urgent, raise it with the Admin.'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
