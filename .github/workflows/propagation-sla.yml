name: propagation-sla

on:
  schedule:
    # Runs weekly on Monday at 09:30 UTC.
    - cron: '30 9 * * 1'
  workflow_dispatch:
  workflow_call:

jobs:
  sla:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan propagation log for stale propagation actions
        id: scan
        run: |
          set -e
          # Path is relative to the caller-repo checkout (Leadership); this is a Category-A reusable workflow (Foundation .github/workflows/, called at @v1).
          propagation_log="cadence/propagation-log.md"
          if [ ! -f "$propagation_log" ]; then
            echo "No propagation log."
            echo "result=clean" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Look for unchecked propagation items older than 30 days.
          # Format expected: lines containing "- [ ] ... (Deadline: YYYY-MM-DD)"
          today=$(date +%s)
          stale=""
          while IFS= read -r line; do
            # Extract a YYYY-MM-DD deadline if present
            deadline=$(echo "$line" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            [ -z "$deadline" ] && continue
            deadline_ts=$(date -d "$deadline" +%s 2>/dev/null || echo "")
            [ -z "$deadline_ts" ] && continue
            age=$((today - deadline_ts))
            if [ "$age" -gt 2592000 ]; then  # 30 days in seconds
              stale="${stale}${line}\n"
            fi
          done < <(grep -E "^- \[ \]" "$propagation_log" || true)
          if [ -z "$stale" ]; then
            echo "result=clean" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "result=stale" >> $GITHUB_OUTPUT
          {
            echo 'list<<EOF'
            echo -e "$stale"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - name: Post SLA-breach issue
        if: steps.scan.outputs.result == 'stale'
        uses: actions/github-script@v7
        with:
          script: |
            const list = `${{ steps.scan.outputs.list }}`;
            const body = [
              '# Propagation SLA breach',
              '',
              'The following propagation-log items have propagation deadlines >30 days past due. The Admin escalates or re-assigns these at the next Leadership Forum.',
              '',
              '```',
              list,
              '```'
            ].join('\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Propagation SLA breach — ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['cdr', 'harness']
            });
